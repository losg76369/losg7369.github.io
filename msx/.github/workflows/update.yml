name: Actualizar IPTV Español

on:
  workflow_dispatch:

  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar playlists
        run: python generate_playlists.py

      - name: Mostrar playlists generadas
        run: |
          echo "Contenido de playlists:"
          ls -lh playlists/

      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlists/

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar playlists IPTV en español"
            git push
          fi
